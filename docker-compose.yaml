services:
  starlink_exporter:
    image: "ghcr.io/danopstech/starlink_exporter:latest"
    restart: always
    ports:
      - "9817:9817"

  speedtest_exporter:
    image: "ghcr.io/danopstech/speedtest_exporter:latest"
    restart: always
    ports:
      - "9092:9090"

  blackbox:
    image: "ghcr.io/danopstech/blackbox_exporter:latest"
    restart: always
    user: "root"
    ports:
      - "9115:9115"
    volumes:
      - type: bind
        source: ./config/blackbox/config.yaml
        target: /etc/blackbox_exporter/config.yml

  prometheus:
    image: "ghcr.io/danopstech/prometheus:latest"
    restart: always
    user: "root"
    ports:
      - "9090:9090"
    volumes:
      - type: bind
        source: ./config/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
      - type: bind
        source: ./data/prometheus
        target: /prometheus

  grafana:
    image: "ghcr.io/danopstech/grafana:latest"
    restart: always
    user: "root"
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=ae3e-plotly-panel
      - GF_LOG_CONSOLE_LEVEL=warn
      - GF_SERVER_HTTP_ADDR=0.0.0.0
    volumes:
      - type: bind
        source: ./data/grafana
        target: /var/lib/grafana
      - type: bind
        source: ./config/grafana/provisioning
        target: /etc/grafana/provisioning/
      - type: bind
        source: ./data/obstruction
        target: /usr/share/grafana/public/obstruction
        read_only: true

  obstruction_map:
    build: ./obstruction-map
    restart: always
    ports:
      - "9818:9818"
    environment:
      DISH_HOST: "192.168.100.1"
      DISH_PORT: "9201"
      POLL_SECONDS: "10"
      OUT_DIR: "/out"
    volumes:
      - type: bind
        source: ./data/obstruction
        target: /out
